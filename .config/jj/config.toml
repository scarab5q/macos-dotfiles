[aliases]
# Diff the local bookmark at/behind @ against its remote-tracked counterpart.
# Requires both to share history — run `jj git fetch` first if you suspect divergence.
diff-remote = ["diff", "--from", "current_bookmark_remote()", "--to", "current_bookmark()"]
push = ["git", "push", "-b"]
track = ["bookmark", "track"]
thing = ["new", "trunk()"]
# Fetch latest dev and re-peg a stack onto trunk(). No arg = current stack (@);
# pass a bookmark/revset to restack that instead, e.g. `jj sync jack/foo`.
# Backed by ~/scripts/jj-sync, which adds --skip-emptied (drops squash-merged lower
# commits) and repairs bookmark divergence from GitHub "Update branch" merges before
# rebasing. jj never auto-rebases across a fetch, so this is the one-shot "pull + restack".
sync = ["util", "exec", "--", "bash", "/Users/scarab5q/scripts/jj-sync"]


[revset-aliases]
"current_bookmark()" = "heads(bookmarks() & ::@)"
"current_bookmark_remote()" = "heads(remote_bookmarks() & ::@)"
"trunk" = "trunk()"


[revsets]
# Default `jj log` view: just trunk plus the stack you're currently on (@ and its
# ancestors above trunk). Keeps the dozens of unrelated stale bookmarks out of the way.
# Override anytime with an explicit `jj log -r '...'` (e.g. `-r 'all()'`).
log = "trunk() | (trunk()..@)"


[ui]
merge-editor = "mergiraf"
# Pipe diffs/logs through delta. `:git` makes jj emit git-style unified diffs
# so delta can syntax-highlight them.
pager = ["delta", "--paging=auto"]
diff-formatter = ":git"

[merge-tools.diffconflicts]
program = "nvim"
merge-args = [
    "-c", "let g:jj_diffconflicts_marker_length=$marker_length",
    "-c", "JJDiffConflicts!", "$output", "$base", "$left", "$right",
]
merge-tool-edits-conflict-markers = true

# mergiraf: structural (AST-aware) auto-resolver. Falls back to writing
# conflict markers for anything it can't auto-resolve, then you can edit
# the file directly or rerun `jj resolve --tool diffconflicts` for a 2-way view.
[merge-tools.mergiraf]
program = "mergiraf"
merge-args = ["merge", "--compact", "-o", "$output", "$base", "$left", "$right"]
merge-tool-edits-conflict-markers = true
merge-conflict-exit-codes = [1]



