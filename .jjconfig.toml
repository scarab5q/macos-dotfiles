[revset-aliases]
# Returns the closest merge commit to `to`
"closest_merge(to)" = "heads(::to & merges())"

[aliases]
# Inserts the given revset as a new branch under the megamerge.
refresh-dev = ["util", "exec", "--", "zsh", "-c", "jj git fetch && jj bookmark set local-dev -r dev@origin"]
check-dev = ["util", "exec", "--", "zsh", "-c", "jj log -r 'local-dev' --no-graph && echo '---' && jj log -r 'dev@origin' --no-graph"]
fetch = ["git", "fetch"]
tug = ["bookmark", "move", "--from", "heads(::@- & bookmarks())", "--to", "@"]
# Local bookmark tips that aren't also on any remote — either never pushed or amended after push.
unsynced = ["log", "-r", "bookmarks() ~ remote_bookmarks()", "--no-graph", "-T", 'bookmarks ++ "\n"']
stack = ["rebase", "--after", "trunk()", "--before", "closest_merge(@)", "--revisions"]
stage = ["stack", "closest_merge(@)+:: ~ empty()"]
